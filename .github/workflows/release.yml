name: Release

# HACS installs the card from dist/ at the release tag, not from a release asset: GitHub's
# asset-download redirect sends a header longer than aiohttp accepts, so HA can't fetch assets.
# Check that the committed dist/ matches a fresh build of the tagged source.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check dist/ is up to date
        run: git diff --exit-code -- dist/
